<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY 学祭ステージ DRAFT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{--bg:#fff6e5;--ink:#1d1b30;--sub:#6b6780;--card:#fff;--line:#e4dccb;--a:#ff3d6e;--c:#6c4cff;--g1:#ffd54a;--g2:#ff8a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--ink:#f4f0ff;--sub:#a49fc0;--card:#201d36;--line:#35305a}}
:root[data-theme="dark"]{--bg:#13111f;--ink:#f4f0ff;--sub:#a49fc0;--card:#201d36;--line:#35305a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;margin:.4em 0}
h1{font-size:34px;line-height:1.2}h2{font-size:21px}
.sub{color:var(--sub);font-size:14px;margin:.3em 0 1em}
.top{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:9px;margin:6px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--a))}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--a);color:#fff;font:900 16px inherit;font-family:inherit;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}.btn.big{padding:34px 14px;font-size:20px;background:linear-gradient(135deg,var(--c),var(--a))}
.ghost{background:none;border:2px solid var(--line);color:var(--ink);padding:10px;border-radius:12px;font:700 14px inherit;font-family:inherit;width:100%;margin-top:10px;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--c),var(--a));color:#fff;border-radius:22px;padding:24px 20px;margin:8px 0 16px}
.hero p{margin:.5em 0;font-size:14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.st{display:flex;align-items:center;gap:14px;font-weight:900;font-size:20px}
.st button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.pre{display:flex;gap:8px;flex-wrap:wrap}.pre button{flex:1;padding:8px;border-radius:10px;border:2px solid var(--c);background:none;color:var(--c);font:700 13px inherit;font-family:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.gc{height:156px;perspective:800px;cursor:pointer}
.f{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.gc.open .f{transform:rotateY(180deg)}
.bk,.fr{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.bk{background:linear-gradient(135deg,var(--c),var(--a));color:#fff;font:36px "Dela Gothic One",sans-serif}
.fr{transform:rotateY(180deg);background:var(--card);border:2px solid var(--line)}
.fr.r2{border-color:var(--c)}.fr.r3{background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1a00;border-color:#fff;box-shadow:0 0 18px var(--g1)}
.star{font-size:12px;letter-spacing:2px}.nm{font-weight:900;font-size:19px;line-height:1.25;margin:2px 0}.bd{font-size:12px;opacity:.8}
.tag{font-size:10px;font-weight:900;border-radius:99px;padding:1px 8px;margin-top:6px;color:#fff;background:#888}
.t-F{background:#2fb36b}.t-S{background:#1f8fe8}.t-L{background:#e2559c}.t-X{background:#7a5a00}
.slot{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.slot .tm{color:var(--a);font-weight:900;font-size:14px}.slot .bn{font-family:"Dela Gothic One",sans-serif;font-size:20px;margin:2px 0 6px}
.chg{text-align:center;font-size:12px;color:var(--sub);padding:5px 0}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px inherit;font-family:inherit}
textarea{font-size:12px;height:150px;font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .ghost{margin:0}
img.out{width:100%;border-radius:14px;margin-top:10px}
small{color:var(--sub);font-size:11px;display:block;margin-top:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const RAW=`藤井風||F|VK|2
hyde|L'Arc-en-Ciel|S|V|2
藤原基央|BUMP OF CHICKEN|S|VG|2
山口一郎|サカナクション|FS|VG|2

ken|L'Arc-en-Ciel|S|G|2
増川弘明|BUMP OF CHICKEN|S|G|1
岩寺基晴|サカナクション|S|G|1
喜多建介|ASIAN KUNG-FU GENERATION|FL|G|1
長谷部悠生|Kroi|F|G|1
TAIKING|Suchmos|S|G|1

小川幸慈|クリープハイプ|L|G|1
浅井健一||F|VG|2
小山田圭吾|Cornelius|S|G|2
曽我部恵一|サニーデイ・サービス|F|VG|1
TAXMAN|THE BAWDIES|L|G|1
KO-SHIN|WANIMA|S|G|1
加藤隆志|東京スカパラダイスオーケストラ|L|G|1
常田大希|King Gnu|X|G|3
若井滉斗|Mrs. GREEN APPLE|X|G|3
小笹大輔|Official髭男dism|X|G|3
三輪テツヤ|スピッツ|X|G|3
Toru|ONE OK ROCK|X|G|3
難波章浩|Hi-STANDARD|F|B|2
tetsuya|L'Arc-en-Ciel|S|B|2
直井由文|BUMP OF CHICKEN|S|B|1
草刈愛美|サカナクション|S|B|1

関将典|Kroi|F|B|1
HSU|Suchmos|S|B|1
巽啓伍|never young beach|F|B|1
河西ゆりか|羊文学|S|B|1

yukihiro|L'Arc-en-Ciel|S|D|2

伊地知潔|ASIAN KUNG-FU GENERATION|FL|D|1
裕地|Kroi|F|D|1
OK|Suchmos|S|D|1

フクダヒロア|羊文学|S|D|1
ナガマツシンタロウ|SIX LOUNGE|F|D|1

KOUICHI|10-FEET|L|D|1
茂木欣一|東京スカパラダイスオーケストラ|L|D|1
神宮司治|レミオロメン|L|D|1
小泉貴裕|KANA-BOON|L|D|1
FUJI|WANIMA|S|D|1
MARCY|THE BAWDIES|L|D|1
勢喜遊|King Gnu|X|D|3
栗原寿|back number|X|D|3
﨑山龍男|スピッツ|X|D|3
松浦匡希|Official髭男dism|X|D|3
沖祐市|東京スカパラダイスオーケストラ|L|K|1
岡崎英美|サカナクション|S|K|1
益田英知|Kroi|F|K|1
藤澤涼架|Mrs. GREEN APPLE|X|K|3
AAAMYYY|Tempalay|F|K|1
菊池剛|Bialystocks|F|K|1
荒内佑|cero|F|K|1
長谷川大喜|マカロニえんぴつ|L|K|1
Taihei|Suchmos|S|K|1
高野勲|GRAPEVINE|F|K|1
石野卓球|電気グルーヴ|FS|K|2
タカハシマイ|Czecho No Republic|S|K|1`;
const P={V:'ボーカル',G:'ギター',B:'ベース',D:'ドラム',K:'キーボード'},SH={V:'Vo',G:'Gt',B:'Ba',D:'Dr',K:'Key'};
const FN={F:'FUJI ROCK',S:'SUMMER SONIC',L:'LOVE SHOWER',X:'超有名枠'};
const DB=RAW.split('\n').map(l=>{const[n,b,f,p,r]=l.split('|');return{n,b,f,p,r:+r}});
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const slot=i=>tm(540+i*90)+'–'+tm(600+i*90);
let st;
function head(){return `<div class="top"><span>🎪 MY 学祭ステージ</span><span>${st.i+1} / 7 組目</span></div><div class="bar"><i style="width:${st.i/7*100}%"></i></div>`}
function start(){
  st={i:0,bands:[],used:new Set(),cnt:{V:1,G:1,B:1,D:1,K:0}};
  app.innerHTML=`<div class="hero"><h1>自分だけの<br>学祭ステージ<br>を作ろう</h1>
  <p>9:00〜19:00、1バンド60分＋転換30分。出演は全7バンド。</p>
  <p>編成を決めたら、パートごとにガチャで4人が登場。ドラフト形式で1人を指名して、夢のバンドを組もう。</p></div>
  <div class="box">🎸 2026年の FUJI ROCK / SUMMER SONIC / SWEET LOVE SHOWER 出演者に、King Gnu などの超有名枠を加えたメンバーが登場します。</div>
  <div class="box">⭐ ★3 は超有名枠のレアカード。一度指名した人は、他のバンドには出てきません。</div>
  <button class="btn" onclick="showForm()">ステージを作る</button>
  <small>ファンによる遊びの企画です。担当パートや所属は発表情報などをもとにしており、実際と異なる場合があります。</small>`;
}
function showForm(){
  const t=Object.values(st.cnt).reduce((a,b)=>a+b,0);
  app.innerHTML=`${head()}<h2>${slot(st.i)} の編成</h2><p class="sub">パートごとの人数を決めよう（合計1〜10人）</p>
  <div class="pre">${[['3ピース',[0,1,1,1,0]],['4ピース',[1,1,1,1,0]],['5ピース',[1,1,1,1,1]],['6ピース',[1,2,1,1,1]]].map(([n,a])=>`<button onclick="setPre([${a}])">${n}</button>`).join('')}</div>
  ${Object.keys(P).map(k=>`<div class="row"><b>${P[k]}</b><div class="st"><button onclick="ch('${k}',-1)">−</button><span>${st.cnt[k]}</span><button onclick="ch('${k}',1)">＋</button></div></div>`).join('')}
  <p class="sub" style="text-align:center"><b style="color:var(--ink)">${t}人編成</b>${st.cnt.V==0&&st.cnt.G>0?'（ボーカルなし → 最初のギターは歌えるギタボから選びます）':''}</p>
  <button class="btn" ${t<1?'disabled':''} onclick="begin()">この編成でドラフト開始</button>`;
}
function setPre(a){'VGBDK'.split('').forEach((k,i)=>st.cnt[k]=a[i]);showForm()}
function ch(k,d){const v=st.cnt[k]+d,t=Object.values(st.cnt).reduce((a,b)=>a+b,0)+d;if(v<0||v>4||t>10)return;st.cnt[k]=v;showForm()}
function begin(){
  st.seq=[];'VGBDK'.split('').forEach(k=>{for(let j=0;j<st.cnt[k];j++)st.seq.push({p:k})});
  if(st.cnt.V==0){const g=st.seq.find(s=>s.p=='G');if(g)g.needV=1}
  st.pk=[];st.step=0;st.rr=1;st.cands=null;draft();
}
function pool(s){
  let a=DB.filter(d=>d.p.includes(s.p)&&!st.used.has(d.n)&&!(s.needV&&!d.p.includes('V')));
  return a.length?a:DB.filter(d=>d.p.includes(s.p)&&!st.used.has(d.n));
}
function draw(s){
  let a=pool(s).slice(),o=[];const w={1:6,2:3,3:1.5};
  while(o.length<4&&a.length){let t=a.reduce((x,d)=>x+w[d.r],0),r=Math.random()*t,i=0;for(;i<a.length;i++){r-=w[a[i].r];if(r<=0)break}if(i>=a.length)i=a.length-1;o.push(a.splice(i,1)[0])}
  return o.length?o:[{n:'助っ人（軽音部OB）',b:'学内',f:'',p:s.p,r:1}];
}
function cards(){
  return `<div class="grid">${st.cands.map((d,i)=>`<div class="gc" onclick="pick(${i},this)"><div class="f"><div class="bk">?</div><div class="fr r${d.r}"><div class="star">${'★'.repeat(d.r)}</div><div class="nm">${esc(d.n)}</div><div class="bd">${esc(d.b||'SOLO')}</div>${d.f?`<span class="tag t-${d.f[0]=='X'?'X':d.f[0]}">${d.f.split('').map(c=>FN[c]).join(' / ')}</span>`:''}</div></div></div>`).join('')}</div>`;
}
function chips(){return `<div class="chips">${st.pk.map(x=>`<span class="chip">${SH[x.p]} ${esc(x.d.n)}</span>`).join('')||'<span class="sub">まだ誰も指名していません</span>'}</div>`}
function draft(){
  const s=st.seq[st.step];
  app.innerHTML=`${head()}<h2>${st.step+1}/${st.seq.length}人目：${P[s.p]}${s.needV?'（ギターボーカル）':''}</h2>${chips()}
  <div>${st.cands?cards():`<button class="btn big" onclick="roll()">🎰 ガチャを引く</button>`}</div>
  ${st.cands&&st.rr>0?`<button class="ghost" onclick="reroll()">この4人は微妙…引き直す（残り${st.rr}回）</button>`:''}
  ${st.cands?'<p class="sub" style="text-align:center">気になる1枚をタップして指名！</p>':''}`;
  if(st.cands)setTimeout(()=>document.querySelectorAll('.gc').forEach((e,i)=>setTimeout(()=>e.classList.add('open'),i*350)),60);
}
function roll(){st.cands=draw(st.seq[st.step]);draft()}
function reroll(){st.rr--;roll()}
function pick(i,el){
  if(!el.classList.contains('open'))return;
  const s=st.seq[st.step],d=st.cands[i];
  st.used.add(d.n);st.pk.push({p:s.p,d});st.step++;st.cands=null;
  st.step<st.seq.length?draft():nameScreen();
}
function nameScreen(){
  app.innerHTML=`${head()}<h2>メンバー決定！</h2>
  <div class="box">${st.pk.map(x=>`<div><b>${SH[x.p]}</b>　${esc(x.d.n)} <span class="sub">${esc(x.d.b||'SOLO')}</span></div>`).join('')}</div>
  <p class="sub">バンド名をつけよう</p><input type="text" id="bn" maxlength="24" placeholder="BAND ${st.i+1}">
  <button class="btn" onclick="fin()">${st.i<6?'次のバンドへ':'タイムテーブルを見る'}</button>`;
}
function fin(){
  const n=$('#bn').value.trim()||('BAND '+(st.i+1));
  st.bands.push({name:n,pk:st.pk});st.i++;st.rr=1;
  st.i<7?showForm():result();
}
const mem=b=>b.pk.map(x=>SH[x.p]+' '+x.d.n).join(' / ');
function txt(){return '🎪 MY 学祭ステージ\n'+st.bands.map((b,i)=>tm(540+i*90)+'-'+tm(600+i*90)+' '+b.name+'\n   '+mem(b)).join('\n')+'\n#MY学祭ステージ'}
function result(){
  st.i=6;
  app.innerHTML=`<h1>MY 学祭ステージ</h1><p class="sub">9:00 OPEN → 19:00 CLOSE ／ 全7バンド</p>
  ${st.bands.map((b,i)=>`<div class="slot"><div class="tm">${slot(i)}</div><div class="bn">${esc(b.name)}</div><div class="chips" style="margin:0">${b.pk.map(x=>`<span class="chip">${SH[x.p]} ${esc(x.d.n)}</span>`).join('')}</div></div>${i<6?'<div class="chg">転換 30分</div>':''}`).join('')}
  <h2 style="margin-top:22px">共有しよう</h2>
  <div class="acts"><button class="ghost" onclick="cp()" id="cpb">テキストをコピー</button><button class="ghost" onclick="tw()">Xでシェア</button><button class="ghost" onclick="im()">画像にする</button><button class="ghost" onclick="start()">もう一度作る</button></div>
  <div id="imo"></div><textarea id="ta" readonly>${esc(txt())}</textarea>`;
  window.scrollTo(0,0);
}
function cp(){
  const t=$('#ta'),b=$('#cpb');t.select();
  const ok=()=>b.textContent='コピーしました！';
  try{navigator.clipboard.writeText(txt()).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){try{document.execCommand('copy');ok()}catch(e2){}}
}
function tw(){
  const t='🎪 MY 学祭ステージ\n'+st.bands.map((b,i)=>tm(540+i*90)+' '+b.name).join('\n')+'\n#MY学祭ステージ';
  let u='https://twitter.com/intent/tweet?text='+encodeURIComponent(t);
  if(/^http/.test(location.href))u+='&url='+encodeURIComponent(location.href);
  window.open(u,'_blank');
}
function im(){
  const c=document.createElement('canvas'),W=1080;c.width=W;let x=c.getContext('2d');
  const F=(z,w='700')=>`${w} ${z}px "Zen Kaku Gothic New",sans-serif`;
  const wrap=(t,mw)=>{x.font=F(30,'500');const o=[];let l='';for(const ch of t){if(x.measureText(l+ch).width>mw){o.push(l);l=ch}else l+=ch}o.push(l);return o};
  const L=st.bands.map(b=>wrap(mem(b),W-160));
  const H=215+L.reduce((a,l)=>a+110+l.length*42+22,0)+40;c.height=H;x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a1f6e');g.addColorStop(1,'#ff3d6e');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.font=F(64,'900');x.fillText('MY 学祭ステージ',60,110);
  x.font=F(32,'500');x.fillText('9:00 OPEN → 19:00 CLOSE ／ 全7バンド',60,165);
  let y=205;
  st.bands.forEach((b,i)=>{
    const h=110+L[i].length*42;
    x.fillStyle='rgba(255,255,255,.93)';x.beginPath();x.roundRect?x.roundRect(40,y,W-80,h,24):x.rect(40,y,W-80,h);x.fill();
    x.fillStyle='#ff3d6e';x.font=F(34,'900');x.fillText(tm(540+i*90)+'–'+tm(600+i*90),70,y+52);
    x.fillStyle='#1d1b30';x.font=F(40,'900');x.fillText(b.name,330,y+54,W-400);
    x.font=F(30,'500');x.fillStyle='#444';L[i].forEach((t,j)=>x.fillText(t,70,y+102+j*42));
    y+=h+22;
  });
  $('#imo').innerHTML=`<img class="out" src="${c.toDataURL('image/png')}" alt="タイムテーブル"><p class="sub">長押し（PCは右クリック）で画像を保存できます</p>`;
